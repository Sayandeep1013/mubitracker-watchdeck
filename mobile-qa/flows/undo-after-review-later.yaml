# Regression: plan item 0.5 — undo desync after a review-later swipe.
#
# `performAction` skipped `setLastAction` when `reviewLater` was true but still
# ran `setIndex(i + 1)`. The undo pill therefore kept naming the PREVIOUS card,
# and tapping it undid the wrong title while rewinding to a different one.
#
# Updated for plan item 3.6 (2026-08-13): gesture map is now unified with web
# (↑ = Watch Later, ↓ = Review Later). Card B below swipes DOWN.
#
# Updated 2026-08-14: the Undo chip's visible text used to be
# `Undo "${title}"`; it's now just "Undo" (a small corner chip on the
# poster, see deck.tsx) with the title only in its accessibilityLabel
# (`Undo marking ${title}`) — assertions below match that instead.

appId: host.exp.exponent
name: Undo names the correct title after review-later
tags:
  - regression
  - deck
---
- runFlow: ../subflows/open-project.yaml
- runFlow: ../subflows/sign-in.yaml

- extendedWaitUntil:
    visible: "Deck"
    timeout: 45000

# Card A — classify it normally so an undo entry definitely exists.
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleA
- swipe:
    start: "20%, 50%"
    end: "85%, 50%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: "Undo marking ${titleA}"

# Card B — send it to Review Later with a swipe down.
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleB
- swipe:
    start: "50%, 25%"
    end: "50%, 70%"
    duration: 300

# The regression: this showed the wrong accessibilityLabel (still naming
# titleA) because card B was never recorded, even though the deck had
# already advanced past it.
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: "Undo marking ${titleB}"
- takeScreenshot: undo-names-review-later-title

# And undoing must restore that same title, not the earlier one.
- tapOn: "Undo"
- extendedWaitUntil:
    notVisible: "Undoing"
    timeout: 15000
- assertVisible: "${titleB}"
