# Plan items 3.2/3.5/3.6 — deck gesture map unified with web.
#
# Updated 2026-08-14, twice:
# 1. Buttons stopped needing a separate Confirm step (commit on tap).
# 2. Buttons were then removed ENTIRELY — deck is solely gesture-driven
#    now, by explicit direction. This deliberately drops spec 31 §2's
#    "no action may be gesture-only" guarantee on mobile; that's this
#    session's product decision, not an oversight. The old "fallback
#    buttons only, no swipe at all" section (spec 31 §2) is gone —
#    there is no fallback to test anymore.
#
# Also: the Undo pill's visible text used to be `Undo "${title}"`; it's
# now just "Undo" (a small corner chip on the poster, see deck.tsx) with
# the title only in its accessibilityLabel (`Undo marking ${title}`).
# Assertions below match that label instead of screen text.
#
# Verifies, in order: swipe left = Haven't, swipe right = Watched,
# swipe up = Watch Later, swipe down = Review Later. Each step checks the
# Undo chip names the card that was just acted on, which only happens if
# performAction actually ran.

appId: host.exp.exponent
name: Deck gesture map matches web
tags:
  - regression
  - deck
---
- runFlow: ../subflows/open-project.yaml
- runFlow: ../subflows/sign-in.yaml

- extendedWaitUntil:
    visible: "Deck"
    timeout: 45000

# ← Haven't
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleLeft
- swipe:
    start: "85%, 50%"
    end: "20%, 50%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: "Undo marking ${titleLeft}"

# → Watched
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleRight
- swipe:
    start: "20%, 50%"
    end: "85%, 50%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: "Undo marking ${titleRight}"

# ↑ Watch Later
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleUp
- swipe:
    start: "50%, 70%"
    end: "50%, 25%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: "Undo marking ${titleUp}"

# ↓ Review Later
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleDown
- swipe:
    start: "50%, 25%"
    end: "50%, 70%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: "Undo marking ${titleDown}"
- takeScreenshot: deck-gesture-map-all-four-directions
