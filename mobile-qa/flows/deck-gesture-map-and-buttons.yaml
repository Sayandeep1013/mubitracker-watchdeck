# Plan items 3.2/3.5/3.6 — deck gesture map unified with web, plus the
# fallback button row so no action is gesture-only.
#
# Updated 2026-08-14: the button row no longer has a separate Confirm step
# (user ask — buttons now commit immediately on tap, same as a swipe) and
# the deck screen now has a hamburger menu instead of some bottom tabs —
# both changed the accessibilityLabel strings this flow selects by. The
# "Select X" / "Confirm X" two-step is gone; there's just one tap per
# action now: `${meta.label} — ${title}` (see ActionButton in deck.tsx).
#
# Verifies, in order: swipe left = Haven't, swipe right = Watched,
# swipe up = Watch Later, swipe down = Review Later, and finally that the
# same "Haven't" outcome is reachable with zero gestures via a single
# button tap (spec 31 §2's "no action may be gesture-only" rule). Each
# step checks the Undo pill names the card that was just acted on, which
# only happens if performAction actually ran.

appId: host.exp.exponent
name: Deck gesture map matches web; fallback buttons work
tags:
  - regression
  - deck
---
- runFlow: ../subflows/open-project.yaml
- runFlow: ../subflows/sign-in.yaml

- extendedWaitUntil:
    visible: "Deck"
    timeout: 45000

# ← Haven't
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleLeft
- swipe:
    start: "85%, 50%"
    end: "20%, 50%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: 'Undo "${titleLeft}"'

# → Watched
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleRight
- swipe:
    start: "20%, 50%"
    end: "85%, 50%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: 'Undo "${titleRight}"'

# ↑ Watch Later
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleUp
- swipe:
    start: "50%, 70%"
    end: "50%, 25%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: 'Undo "${titleUp}"'

# ↓ Review Later
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleDown
- swipe:
    start: "50%, 25%"
    end: "50%, 70%"
    duration: 300
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: 'Undo "${titleDown}"'
- takeScreenshot: deck-gesture-map-all-four-directions

# Fallback buttons only — no swipe at all. One tap on "Haven't" commits
# immediately (no separate Confirm step), matching deck.tsx's ActionButton
# accessibilityLabel: `${meta.label} — ${title}`.
- extractTextWithAI:
    query: "The media title shown on the deck card, exactly as written"
    outputVariable: titleButtons
- tapOn:
    text: "Haven't — ${titleButtons}"
- extendedWaitUntil:
    visible: "Undo"
    timeout: 10000
- assertVisible: 'Undo "${titleButtons}"'
- takeScreenshot: deck-fallback-buttons-no-gesture
