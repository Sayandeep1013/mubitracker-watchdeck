# Ensures the app is signed in, creating a fresh throwaway account if needed.
#
# Accounts use the `mqa` prefix so they are identifiable and cleanable
# (spec 50 §5). There is no auth-bypass build flag yet, so this drives the
# real signup UI.

appId: host.exp.exponent
---
# Already signed in from a previous flow — nothing to do.
- runFlow:
    when:
      visible: "Deck"
    commands:
      - assertVisible: "Deck"

- runFlow:
    when:
      visible: "Username"
    commands:
      - evalScript: ${output.user = 'mqa' + String(Date.now()).slice(-9)}

      - tapOn: "Need an account? Sign up"

      # `hint:` is not a valid Maestro selector key (confirmed live —
      # "Unknown Property: hint" aborts the flow before any command runs).
      # An empty TextInput's placeholder is exposed as its `text` for
      # matching purposes, same as the login form's own fields.
      - tapOn:
          text: "Username"
      - inputText: ${output.user}
      # Not always dismissable on this Gboard config ("Couldn't hide the
      # keyboard" aborted the flow live) - optional since it's a nicety;
      # tapping the next field/button works fine with it still open.
      - hideKeyboard:
          optional: true

      - tapOn:
          text: "Password"
      - inputText: "TestPass123!"
      # Not always dismissable on this Gboard config ("Couldn't hide the
      # keyboard" aborted the flow live) - optional since it's a nicety;
      # tapping the next field/button works fine with it still open.
      - hideKeyboard:
          optional: true

      # Google Password Manager can appear over the form.
      - tapOn:
          text: "No, thanks"
          optional: true

      - tapOn: "Create Account"

      # And again after submitting, offering to save the new password.
      - tapOn:
          text: "Not now"
          optional: true

      - extendedWaitUntil:
          visible: "Deck"
          timeout: 45000
