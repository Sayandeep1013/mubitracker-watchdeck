name: Nightly

on:
  schedule:
    - cron: '0 18 * * *' # 23:30 IST — spec 50 §3
  workflow_dispatch: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Full API contract smoke + test-data cleanup against production (spec 50 §5).
  contract-smoke-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-deck-loop.mjs
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      - run: node scripts/cleanup-test-accounts.mjs --older-than 24h --confirm
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Device E2E (spec 50 §3/§4) — a Maestro no-op costs ~24s, too slow
  # per-push, so this is the only place mobile-qa/flows/ actually runs.
  #
  # Uses a real Android emulator (KVM-accelerated GitHub-hosted Linux
  # runner) + a sideloaded Expo Go APK matching the project's SDK, exactly
  # like mobile-qa/config.yaml's local prerequisites — no native build,
  # no EAS. The Expo Go APK URL is resolved at run time from Expo's own
  # versions API rather than hardcoded, since it's tied to the SDK version
  # and would go stale otherwise.
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mubitracker/shared build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Resolve this SDK's Expo Go APK and sideload it once the emulator is up, then run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            APK_URL=$(node scripts/resolve-expo-go-apk.mjs)
            echo "Expo Go APK: $APK_URL"
            curl -fsSL "$APK_URL" -o expo-go.apk
            adb install -r expo-go.apk

            pnpm --filter @mubitracker/mobile dev --non-interactive &
            METRO_PID=$!
            # Metro's first bundle build is the slow part — poll instead of a fixed sleep.
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8081/status && break
              sleep 2
            done
            adb reverse tcp:8081 tcp:8081

            maestro test mobile-qa/flows/ || MAESTRO_EXIT=$?
            kill $METRO_PID || true
            exit ${MAESTRO_EXIT:-0}
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.STAGING_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: |
            ~/.maestro/tests
          if-no-files-found: ignore
